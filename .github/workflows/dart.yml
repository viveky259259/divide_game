name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos stay visible but do not fail the build: the only ones left are
      # Flutter 3.47's notice that material.dart is moving to the material_ui
      # package, and migrating would drop support for older SDKs.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
