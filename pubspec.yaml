name: mumbai_train_quiz
description: KBC-style quiz game based on the Mumbai local train journey from Virar to Churchgate.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/images/
    - asset/sounds/
